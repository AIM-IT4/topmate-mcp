name: CI

on:
  push:
    branches: ["professional-v1", "main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app.py topmate_mcp
      - name: Unit tests
        run: pytest -q
      - name: Import production app
        env:
          TOPMATE_PROVIDER: sandbox
          MCP_AUTH_MODE: none
        run: python -c "from app import app; print(app.title)"
